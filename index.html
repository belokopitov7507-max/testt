<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Удаление водяных знаков с видео прямо в браузере: настоящий inpainting (Telea, Fast Marching), локальная обработка, сохранение звука." />
    <title>Чистокадр — удаление водяных знаков с видео</title>
    <link rel="icon" href="image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='6' width='26' height='20' rx='4' fill='%23141922' stroke='%23ffb224' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23ff4b3e'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700;800&family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700;800&family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      />
    </noscript>
    <style>
      html, body { margin: 0; background: #0a0d12; }
      #root:empty::after {
        content: "";
        position: fixed;
        inset: 0;
        background:
          radial-gradient(900px 500px at 12% -8%, rgba(255, 75, 62, 0.13), transparent 60%),
          radial-gradient(800px 520px at 96% 14%, rgba(255, 178, 36, 0.09), transparent 62%),
          #0a0d12;
      }
    </style>
    <script>
      window.__bootTimer = setTimeout(function () {
        var r = document.getElementById("root");
        if (r && !r.childElementCount) {
          r.innerHTML =
            '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;font-family:Segoe UI,Arial,sans-serif">' +
            '<div style="max-width:520px;border:1px solid #263043;border-radius:14px;background:#131924;padding:28px;color:#e9edf5">' +
            '<div style="font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#ff6a5e">сбой запуска</div>' +
            '<div style="margin-top:10px;font-size:19px;font-weight:700">Скрипт приложения не загрузился</div>' +
            '<div style="margin-top:10px;font-size:13px;color:#aab6cb;line-height:1.55">Проверьте соединение или отключите блокировщик, затем перезагрузите страницу. Приложение полностью локальное.</div>' +
            '<button onclick="location.reload()" style="margin-top:16px;border:none;border-radius:10px;background:#ff4b3e;color:#fff;font-weight:700;font-size:14px;padding:11px 22px;cursor:pointer">Перезагрузить</button>' +
            "</div></div>";
        }
      }, 6000);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
